[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abyss-wallpaper"
version = "0.1.0"
description = "Fetch recent deep-sea discoveries and set one as your desktop wallpaper."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abyss Wallpaper contributors" }]
keywords = ["wallpaper", "deep-sea", "ocean", "noaa", "mbari"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-beautifulsoup4",
]

[project.scripts]
abyss-wallpaper = "abyss_wallpaper.cli:main"

[project.urls]
Homepage = "https://github.com/vili-pet/abyss-wallpaper"
Issues = "https://github.com/vili-pet/abyss-wallpaper/issues"

[tool.setuptools.packages.find]
include = ["abyss_wallpaper*"]

[tool.setuptools.package-data]
abyss_wallpaper = ["py.typed", "data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
